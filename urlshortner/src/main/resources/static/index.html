<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapLink — URL Shortener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 60%, #020617);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 540px;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 1.9rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
        .input-group { display: flex; gap: 10px; }
        input[type="url"] {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus { border-color: #38bdf8; }
        button.primary {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }
        button.primary:hover { opacity: 0.92; transform: translateY(-1px); }
        .result-box {
            display: none;
            margin-top: 22px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #38bdf844;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .result-box a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }
        .copy-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .copy-btn:hover { background: #334155; }
        .history { margin-top: 28px; }
        .history h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 10px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.88rem;
        }
        .orig { color: #94a3b8; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .short { color: #818cf8; text-decoration: none; font-weight: 500; }
        .error { color: #f87171; font-size: 0.88rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>SnapLink</h1>
    <p class="subtitle">Paste a long URL to generate a Base62 short link.</p>

    <form id="shortenForm" class="input-group">
        <input type="url" id="longUrl" placeholder="https://amazon.in..." required />
        <button type="submit" class="primary">Shorten</button>
    </form>
    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <a id="shortLink" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyLink(this)">Copy</button>
    </div>

    <div class="history" id="historySection" style="display:none;">
        <h3>Recent Links</h3>
        <div id="historyList"></div>
    </div>
</div>

<script>
    const form = document.getElementById('shortenForm');
    const resultBox = document.getElementById('resultBox');
    const shortLinkEl = document.getElementById('shortLink');
    const errorMsg = document.getElementById('errorMsg');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        const urlInput = document.getElementById('longUrl').value.trim();

        try {
            const res = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            if (!res.ok) throw new Error('Failed to shorten URL');
            const shortUrl = await res.text();

            shortLinkEl.href = shortUrl;
            shortLinkEl.textContent = shortUrl;
            resultBox.style.display = 'flex';

            addToHistory(urlInput, shortUrl);
            document.getElementById('longUrl').value = '';
        } catch (err) {
            errorMsg.textContent = 'Something went wrong. Make sure your Spring Boot server is running.';
            errorMsg.style.display = 'block';
        }
    });

    function copyLink(btn) {
        navigator.clipboard.writeText(shortLinkEl.textContent);
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
    }

    function addToHistory(original, shortened) {
        historySection.style.display = 'block';
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
                <span class="orig" title="${original}">${original}</span>
                <a class="short" href="${shortened}" target="_blank">${shortened.replace('http://', '')}</a>
            `;
        historyList.prepend(item);
    }
</script>
</body>
</html>
